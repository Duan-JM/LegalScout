services:
  browserless:
    # Optional Remote CDP provider. Set
    # BROWSERLESS_URL=ws://localhost:3000?token=legalscout-local
    # before running LegalScout; local Chrome remains the default.
    image: ghcr.io/browserless/chromium:latest
    container_name: legalscout-browserless
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TOKEN=${BROWSERLESS_TOKEN:-legalscout-local}
      - CONCURRENT=10
      - QUEUED=20
      - TIMEOUT=60000
      - DEBUG=browserless*
    shm_size: "2g"
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/active?token=$$TOKEN"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
