version: '3.8'

services:
  browserless:
    image: browserless/chrome:latest
    container_name: legalscout-browserless
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # 最大并发会话数
      - MAX_CONCURRENT_SESSIONS=10
      # 最大队列长度
      - MAX_QUEUE_LENGTH=20
      # 连接超时（毫秒）
      - CONNECTION_TIMEOUT=60000
      # 启用调试日志
      - DEBUG=browserless*
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
